<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>. Use in a page:  <head th:replace="~{fragments/layout :: head('Page title')}"></head>
     Tailwind is loaded from a CDN (good for development, needs internet). -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | EMS'">EMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<!-- Shared top bar. Use in a page:  <nav th:replace="~{fragments/layout :: navbar}"></nav>
     "session.user" is the logged-in User object stored by AuthController. -->
<nav th:fragment="navbar" class="bg-slate-800 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
        <a th:href="@{/}" class="font-bold text-lg">EMS</a>
        <a th:if="${session.user.staff}" th:href="@{/dashboard}" class="hover:underline">Dashboard</a>
        <a th:href="@{/reports/mine}" class="hover:underline">My Reports</a>
        <a th:href="@{/reports/new}" class="hover:underline">Report an Issue</a>
        <a th:href="@{/equipment}" class="hover:underline">Equipment</a>
        <div class="ml-auto flex items-center gap-3 text-sm">
            <span th:text="${session.user.fullName}">User</span>
            <span class="bg-slate-600 rounded px-2 py-0.5 text-xs" th:text="${session.user.role}">ROLE</span>
            <a th:href="@{/logout}" class="bg-slate-600 hover:bg-slate-500 rounded px-3 py-1">Logout</a>
        </div>
    </div>
</nav>

<!-- Priority badge: HIGH and URGENT are red (RQ11) -->
<span th:fragment="priorityBadge(p)" class="px-2 py-0.5 rounded text-xs font-medium"
      th:classappend="${p == 'URGENT' or p == 'HIGH'} ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'"
      th:text="${p}">MEDIUM</span>

<!-- Status badge -->
<span th:fragment="statusBadge(s)" class="px-2 py-0.5 rounded text-xs font-medium"
      th:classappend="${s == 'PENDING'} ? 'bg-yellow-100 text-yellow-800'
                      : (${s == 'IN_PROGRESS'} ? 'bg-blue-100 text-blue-800'
                      : (${s == 'RESOLVED'} ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-700'))"
      th:text="${s}">PENDING</span>

</body>
</html>
