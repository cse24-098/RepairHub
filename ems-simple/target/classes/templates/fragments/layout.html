<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>. Use in a page:  <head th:replace="~{fragments/layout :: head('Page title')}"></head>
     Tailwind is loaded from a CDN (good for development, needs internet). -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | EMS'">EMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<!-- Shared top bar. Use in a page:  <nav th:replace="~{fragments/layout :: navbar}"></nav>
     "session.user" is the logged-in User object stored by AuthController. -->
<nav th:fragment="navbar" class="bg-slate-800 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
        <a th:href="@{/}" class="font-bold text-lg">EMS</a>
        <a th:if="${session.user.staff}" th:href="@{/dashboard}" class="hover:underline">Dashboard</a>
        <a th:href="@{/reports/mine}" class="hover:underline">My Reports</a>
        <a th:href="@{/reports/new}" class="hover:underline">Report an Issue</a>
        <a th:href="@{/equipment}" class="hover:underline">Equipment</a>

        <div class="ml-auto flex items-center gap-3 text-sm">
            <span th:text="${session.user.fullName}">User</span>
            <span class="bg-slate-600 rounded px-2 py-0.5 text-xs" th:text="${session.user.role}">ROLE</span>

            <!-- ========================================== -->
            <!--  NOTIFICATION CODE           -->
            <!-- ========================================== -->
            <div class="relative inline-block text-left mr-2">
                <!-- Notification Bell Button -->
                <button onclick="document.getElementById('notif-dropdown').classList.toggle('hidden')"
                        class="relative p-1 text-gray-300 hover:text-white focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <!-- Red Badge for unread count -->
                    <span th:if="${not #lists.isEmpty(unreadNotifications)}"
                          th:text="${unreadNotifications.size()}"
                          class="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full">
                    </span>
                </button>

                <!-- Dropdown Menu -->
                <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white rounded-md shadow-lg z-50 border border-gray-200 text-gray-800">
                    <div class="p-3 border-b border-gray-200 bg-gray-50 font-bold rounded-t-md">
                        Notifications
                    </div>
                    <div class="max-h-64 overflow-y-auto">
                        <!-- If no notifications -->
                        <div th:if="${#lists.isEmpty(unreadNotifications)}" class="p-4 text-sm text-gray-500 text-center">
                            No new notifications
                        </div>
                        <!-- Loop through notifications -->
                        <div th:each="notif : ${unreadNotifications}" class="p-3 border-b border-gray-100 hover:bg-gray-50 flex justify-between items-start">
                            <div class="text-sm pr-2" th:text="${notif.message}"></div>
                            <form th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post">
                                <button type="submit" class="text-xs text-blue-500 hover:text-blue-700 font-semibold" title="Mark as read">
                                    &#10003;
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- ========================================== -->
            <!-- END OF NOTIFICATION CODE                   -->
            <!-- ========================================== -->

            <a th:href="@{/logout}" class="bg-slate-600 hover:bg-slate-500 rounded px-3 py-1">Logout</a>
        </div>
    </div>
</nav>

<!-- Priority badge: HIGH and URGENT are red (RQ11) -->
<span th:fragment="priorityBadge(p)" class="px-2 py-0.5 rounded text-xs font-medium"
      th:classappend="${p == 'URGENT' or p == 'HIGH'} ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'"
      th:text="${p}">MEDIUM</span>

<!-- Status badge -->
<span th:fragment="statusBadge(s)" class="px-2 py-0.5 rounded text-xs font-medium"
      th:classappend="${s == 'PENDING'} ? 'bg-yellow-100 text-yellow-800'
                      : (${s == 'IN_PROGRESS'} ? 'bg-blue-100 text-blue-800'
                      : (${s == 'RESOLVED'} ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-700'))"
      th:text="${s}">PENDING</span>

</body>
</html>
