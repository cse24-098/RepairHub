<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Report an Issue')}"></head>
<body class="bg-gray-100 min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="max-w-2xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold mb-4">Report an equipment issue</h1>

    <form th:action="@{/reports/save}" method="post" class="bg-white rounded-lg shadow p-6 space-y-4">

        <div th:if="${error}" class="bg-red-100 text-red-800 rounded p-3 text-sm" th:text="${error}"></div>

        <!-- RQ01: duplicate warning -->
        <div th:if="${duplicateWarning}" class="bg-yellow-100 text-yellow-900 rounded p-3 text-sm space-y-2">
            <p>This equipment was already reported in the last 7 days.</p>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="confirmDuplicate"> Submit anyway, this is a different issue
            </label>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Equipment *</label>
            <select name="equipmentId" required class="w-full border rounded px-3 py-2">
                <option value="">-- choose equipment --</option>
                <option th:each="o : ${equipmentOptions}" th:value="${o.value}" th:text="${o.label}"
                        th:selected="${o.value == form['equipmentId']}"></option>
            </select>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Issue type *</label>
                <select name="issueType" required class="w-full border rounded px-3 py-2">
                    <option value="">-- choose --</option>
                    <option th:each="t : ${issueTypes}" th:value="${t}" th:text="${t}"
                            th:selected="${t == form['issueType']}"></option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Priority *</label>
                <select name="priority" required class="w-full border rounded px-3 py-2">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"
                            th:selected="${form['priority'] != null} ? ${p == form['priority']} : ${p == 'MEDIUM'}"></option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Description * (at least 10 characters)</label>
            <textarea name="description" rows="4" required minlength="10" class="w-full border rounded px-3 py-2"
                      th:text="${form['description']}"></textarea>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Location</label>
                <select name="locationId" class="w-full border rounded px-3 py-2">
                    <option value="">-- not specified --</option>
                    <option th:each="o : ${locations}" th:value="${o.value}" th:text="${o.label}"
                            th:selected="${o.value == form['locationId']}"></option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Extra location details</label>
                <input name="locationDetails" th:value="${form['locationDetails']}" class="w-full border rounded px-3 py-2">
            </div>
        </div>
        <!-- TODO RQ02: file upload.  TODO RQ03: GPS with JavaScript and a map -->

        <div class="flex gap-3">
            <button type="submit" class="bg-slate-800 text-white rounded px-5 py-2 hover:bg-slate-700">Submit report</button>
            <a th:href="@{/reports/mine}" class="px-5 py-2 border rounded bg-white">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
