<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<form th:action="@{/login}" method="post" class="bg-white p-8 rounded-lg shadow w-full max-w-sm space-y-4">
    <h1 class="text-xl font-bold text-slate-800">Equipment Management System</h1>
    <p th:if="${error}" th:text="${error}" class="text-red-600 text-sm"></p>
    <div>
        <label class="block text-sm font-medium mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
        <label class="block text-sm font-medium mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-slate-800 text-white rounded py-2 hover:bg-slate-700">Log in</button>
</form>
</body>
</html>
