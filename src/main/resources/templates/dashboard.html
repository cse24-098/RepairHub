<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="bg-gray-100 min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <div th:if="${success}" class="bg-green-100 text-green-800 rounded p-3" th:text="${success}"></div>
    <h1 class="text-2xl font-bold">Dashboard</h1>

    <!-- RQ11: unresolved count + status summary -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="bg-red-600 text-white rounded-lg p-4 col-span-2 md:col-span-1">
            <div class="text-sm">Unresolved</div>
            <div class="text-3xl font-bold" th:text="${unresolvedCount}">0</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow"><div class="text-sm text-gray-500">Pending</div>
            <div class="text-2xl font-bold" th:text="${counts['PENDING']}">0</div></div>
        <div class="bg-white rounded-lg p-4 shadow"><div class="text-sm text-gray-500">In progress</div>
            <div class="text-2xl font-bold" th:text="${counts['IN_PROGRESS']}">0</div></div>
        <div class="bg-white rounded-lg p-4 shadow"><div class="text-sm text-gray-500">Resolved</div>
            <div class="text-2xl font-bold" th:text="${counts['RESOLVED']}">0</div></div>
        <div class="bg-white rounded-lg p-4 shadow"><div class="text-sm text-gray-500">Rejected</div>
            <div class="text-2xl font-bold" th:text="${counts['REJECTED']}">0</div></div>
    </div>
    <!-- TODO RQ05/RQ08: Chart.js charts (by category, status, priority) -->

    <!-- RQ05: filter by status -->
    <div class="flex flex-wrap gap-2 text-sm">
        <a th:href="@{/dashboard}" class="px-3 py-1 rounded border bg-white"
           th:classappend="${selectedStatus == null} ? 'bg-slate-800 text-white'">All</a>
        <a th:each="s : ${statuses}" th:href="@{/dashboard(status=${s})}" th:text="${s}"
           class="px-3 py-1 rounded border bg-white"
           th:classappend="${selectedStatus == s} ? 'bg-slate-800 text-white'">STATUS</a>
    </div>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full text-sm">
            <thead class="bg-gray-50 text-left">
            <tr>
                <th class="p-3">Reference</th><th class="p-3">Equipment</th><th class="p-3">Reported by</th>
                <th class="p-3">Priority</th><th class="p-3">Status</th><th class="p-3">Submitted</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${reports}" class="border-t"
                th:classappend="${r.priority.name() == 'URGENT' or r.priority.name() == 'HIGH'} ? 'bg-red-50'">
                <td class="p-3"><a th:href="@{/reports/{id}(id=${r.id})}" class="text-blue-700 hover:underline" th:text="${r.referenceNo}">MR-...</a></td>
                <td class="p-3" th:text="${r.equipment.name}">Equipment</td>
                <td class="p-3" th:text="${r.teacher.fullName}">Teacher</td>
                <td class="p-3"><span th:replace="~{fragments/layout :: priorityBadge(${r.priority})}"></span></td>
                <td class="p-3"><span th:replace="~{fragments/layout :: statusBadge(${r.status})}"></span></td>
                <td class="p-3" th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
            </tr>
            <tr th:if="${#lists.isEmpty(reports)}"><td colspan="6" class="p-4 text-gray-500">No reports found.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
