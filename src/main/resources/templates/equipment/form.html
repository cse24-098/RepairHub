<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register Equipment')}"></head>
<body class="bg-gray-100 min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="max-w-2xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold mb-4">Register equipment</h1>

    <form th:action="@{/equipment/save}" th:object="${equipmentForm}" method="post"
          class="bg-white rounded-lg shadow p-6 space-y-4">

        <div>
            <label class="block text-sm font-medium mb-1">Asset tag *</label>
            <input th:field="*{assetTag}" class="w-full border rounded px-3 py-2">
            <p th:if="${#fields.hasErrors('assetTag')}" th:errors="*{assetTag}" class="text-red-600 text-sm"></p>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Name *</label>
            <input th:field="*{name}" class="w-full border rounded px-3 py-2">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm"></p>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Category *</label>
                <select th:field="*{categoryId}" class="w-full border rounded px-3 py-2">
                    <option value="">-- choose --</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-red-600 text-sm"></p>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Location</label>
                <select th:field="*{locationId}" class="w-full border rounded px-3 py-2">
                    <option value="">-- none --</option>
                    <option th:each="l : ${locations}" th:value="${l.id}" th:text="${l.displayName}"></option>
                </select>
            </div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Serial number</label>
                <input th:field="*{serialNumber}" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Condition</label>
                <select th:field="*{conditionState}" class="w-full border rounded px-3 py-2">
                    <option th:each="c : ${conditions}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Date acquired</label>
                <input type="date" th:field="*{dateAcquired}" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Cost</label>
                <input type="number" step="0.01" th:field="*{cost}" class="w-full border rounded px-3 py-2">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Description</label>
            <textarea th:field="*{description}" rows="3" class="w-full border rounded px-3 py-2"></textarea>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-slate-800 text-white rounded px-5 py-2 hover:bg-slate-700">Save</button>
            <a th:href="@{/equipment}" class="px-5 py-2 border rounded bg-white">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
