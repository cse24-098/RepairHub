<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Report Details')}"></head>
<body class="bg-gray-100 min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <div th:if="${success}" class="bg-green-100 text-green-800 rounded p-3" th:text="${success}"></div>

    <div class="bg-white rounded-lg shadow p-6 space-y-3">
        <div class="flex flex-wrap items-center gap-3">
            <h1 class="text-2xl font-bold" th:text="${report.referenceNo}">MR-...</h1>
            <span th:replace="~{fragments/layout :: statusBadge(${report.status})}"></span>
            <span th:replace="~{fragments/layout :: priorityBadge(${report.priority})}"></span>
        </div>
        <dl class="grid md:grid-cols-2 gap-x-6 gap-y-2 text-sm">
            <div><dt class="text-gray-500">Equipment</dt>
                <dd th:text="${report.equipment.assetTag + ' - ' + report.equipment.name}"></dd></div>
            <div><dt class="text-gray-500">Issue type</dt><dd th:text="${report.issueType}"></dd></div>
            <div><dt class="text-gray-500">Reported by</dt><dd th:text="${report.teacher.fullName}"></dd></div>
            <div><dt class="text-gray-500">Submitted</dt>
                <dd th:text="${#temporals.format(report.createdAt, 'dd MMM yyyy HH:mm')}"></dd></div>
            <div><dt class="text-gray-500">Location</dt>
                <dd th:text="${report.location != null} ? ${report.location.displayName} : '-'"></dd></div>
            <div><dt class="text-gray-500">Location details</dt>
                <dd th:text="${report.locationDetails != null} ? ${report.locationDetails} : '-'"></dd></div>
        </dl>
        <div>
            <div class="text-gray-500 text-sm">Description</div>
            <p class="whitespace-pre-line" th:text="${report.description}"></p>
        </div>
        <!-- TODO RQ02: show attachment thumbnails. TODO RQ03: map preview from latitude/longitude -->
    </div>

    <!-- Audit trail (RQ04 / RQ06) -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="font-semibold mb-3">Status history</h2>
        <ul class="space-y-3 text-sm">
            <li th:each="h : ${history}" class="border-l-4 border-slate-300 pl-3">
                <div>
                    <span th:if="${h.oldStatus != null}" th:text="${h.oldStatus.name() + ' → ' + h.newStatus.name()}"></span>
                    <span th:if="${h.oldStatus == null}" th:text="${h.newStatus.name()}"></span>
                    <span class="text-gray-500"
                          th:text="${' · ' + h.changedBy.fullName + ' · ' + #temporals.format(h.changedAt, 'dd MMM yyyy HH:mm')}"></span>
                </div>
                <div th:text="${h.comment}"></div>
            </li>
        </ul>
    </div>

    <!-- Staff only: change status (RQ06) -->
    <div sec:authorize="hasAnyRole('TECHNICIAN','SCHOOL_ADMIN','SYSTEM_ADMIN')" class="bg-white rounded-lg shadow p-6">
        <h2 class="font-semibold mb-3">Update status</h2>
        <form th:action="@{/reports/{id}/status(id=${report.id})}" th:object="${statusForm}" method="post" class="space-y-3">
            <div>
                <select th:field="*{newStatus}" class="border rounded px-3 py-2">
                    <option value="">-- new status --</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
                <p th:if="${#fields.hasErrors('newStatus')}" th:errors="*{newStatus}" class="text-red-600 text-sm"></p>
            </div>
            <div>
                <textarea th:field="*{comment}" rows="3" placeholder="Comment (required)" class="w-full border rounded px-3 py-2"></textarea>
                <p th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="text-red-600 text-sm"></p>
            </div>
            <button type="submit" class="bg-slate-800 text-white rounded px-5 py-2 hover:bg-slate-700">Update</button>
        </form>
    </div>
</main>
</body>
</html>
