spring.application.name=ems
server.port=8080

# --- Database (override with environment variables if needed) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ems_user}
spring.datasource.password=${DB_PASSWORD:ems_pass}

# --- JPA: Flyway owns the schema, Hibernate never changes tables ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Thymeleaf (cache off for development) ---
spring.thymeleaf.cache=false

# --- File uploads (used later for RQ02) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
