# Shared local MySQL so everyone in the team has the same database setup.
# Start:  docker compose up -d      Stop: docker compose down
# Reset (wipes data): docker compose down -v
services:
  mysql:
    image: mysql:8.4
    container_name: ems-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ems_db
      MYSQL_USER: ems_user
      MYSQL_PASSWORD: ems_pass
    ports:
      - "3306:3306"
    volumes:
      - ems_mysql_data:/var/lib/mysql
volumes:
  ems_mysql_data:
